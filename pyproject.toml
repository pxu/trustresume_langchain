[project]
name = "trustresume"
version = "0.1.0"
description = "Evidence-based, ATS-friendly resume generation using RAG, multi-agent AI, and trust verification — LangChain/LangGraph/ChromaDB port."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core",
    "langchain",
    "langchain-text-splitters",
    "langgraph",
    "langchain-chroma",
    "chromadb",
    "fastembed",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "unstructured[pdf,docx]",
    "boto3",
    "python-dotenv",
    "fpdf2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    # Only used to build .docx fixtures in tests/unit/test_ingestion.py — the
    # app itself parses .docx via the unstructured[docx] core dependency.
    "python-docx",
]
# Per-provider LLM SDKs, mirroring the original's lazy-import-per-branch
# pattern in api/model_factory.py. Bedrock uses boto3 (already a core dep).
providers = [
    "langchain-aws",
    "langchain-openai",
    "langchain-google-genai",
]
# Streamlit frontend (src/trustresume/ui/) — a REST client over the FastAPI
# backend, so it's an independent extra rather than a core dependency.
ui = [
    "streamlit",
    "requests",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# --- Tooling configuration -------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
# scripts/ holds throwaway manual test scripts (e.g. hardcoded resume text
# for a one-off RAG smoke test) — not held to the same lint bar as src/tests.
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["trustresume", "tests"]

[tool.mypy]
python_version = "3.12"
packages = ["trustresume"]
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["boto3.*", "chromadb.*", "fastembed.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
# Coverage runs on every `pytest` invocation (not just an opt-in extra flag)
# and fails the run under the threshold — the offline suite is fast enough
# (a few seconds) that this doesn't slow down the inner dev loop, and it's
# the only way a coverage regression actually blocks CI rather than just
# showing up in a report nobody reads.
addopts = """
    -ra --strict-markers -m 'not live'
    --cov=src/trustresume --cov-report=term-missing --cov-fail-under=95
"""
markers = [
    "live: end-to-end tests that boot a real uvicorn server and call it over HTTP",
]

[tool.coverage.run]
source = ["src/trustresume"]
branch = true
# poc/ is throwaway live-provider validation code (its own module docstring:
# "not part of the TrustResume pipeline") — meaningfully testing it needs a
# real LLM call, so it's exercised manually, the same reason test_api_live.py
# is `live`-marked rather than covered here.
#
# evals/cli.py is the same case: it's the one module in the eval harness that
# builds real dependencies (fastembed, a real Chroma collection, a real LLM),
# which is exactly what the offline suite exists to avoid. Everything it calls
# — metrics, dataset loading, both evaluators — is dependency-injected and
# fully covered by tests/unit/test_evals.py and test_eval_metrics.py.
omit = ["src/trustresume/poc/*", "src/trustresume/evals/cli.py"]

[tool.coverage.report]
show_missing = true
